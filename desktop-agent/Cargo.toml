[package]
name = "simpleguard-desktop-agent"
version = "0.1.0"
edition = "2021"
description = "Core contract for the SimpleGuard desktop agent pairing flow"
publish = false
build = "build.rs"

[lib]
name = "simpleguard_desktop_agent"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
