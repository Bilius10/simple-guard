exclude: ^(android-agent/(\.gradle|\.gradle-user|\.gradle-codex-coverage|\.kotlin|build|app/build)/|api/(\.m2|target|AppData)/|web-admin/(node_modules|dist|coverage|\.angular)/|desktop-agent/target/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-json
      - id: pretty-format-json
        args: ["--autofix", "--indent", "2"]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: forbid-submodules

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: repo-policy
        name: "repo: forbidden tracked paths"
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .codex/review/run-repo-policy.ps1
        language: system
        pass_filenames: false
