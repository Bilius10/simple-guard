build:
  maxIssues: 0

config:
  validation: true

complexity:
  CyclomaticComplexMethod:
    threshold: 15
  LargeClass:
    threshold: 500
  LongMethod:
    threshold: 45
  LongParameterList:
    active: false
  TooManyFunctions:
    thresholdInClasses: 45
    thresholdInObjects: 14

exceptions:
  TooGenericExceptionCaught:
    active: false

formatting:
  ArgumentListWrapping:
    active: false
  Indentation:
    active: false
  MaximumLineLength:
    active: false
  ParameterListWrapping:
    active: false

naming:
  FunctionNaming:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  WildcardImport:
    active: false
