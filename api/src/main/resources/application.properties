spring.application.name=simpleguard-api

simpleguard.instance-id=${SIMPLEGUARD_INSTANCE_ID:}
simpleguard.public-url=${SIMPLEGUARD_PUBLIC_URL:}
simpleguard.oidc.issuer-uri=${SIMPLEGUARD_OIDC_ISSUER_URI:}
simpleguard.oidc.jwk-set-'uri=${SIMPLEGUARD_OIDC_JWK_SET_URI:}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

server.forward-headers-strategy=framework
